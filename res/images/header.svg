<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="850" height="200">

  <defs>
    <!-- Затухание линий по краям (слева и справа) -->
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#9fb6cc" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#9fb6cc" stop-opacity="0.22"/>
      <stop offset="50%"  stop-color="#9fb6cc" stop-opacity="0.30"/>
      <stop offset="80%"  stop-color="#9fb6cc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9fb6cc" stop-opacity="0"/>
    </linearGradient>

    <!-- Обрезка по скруглённому фону -->
    <clipPath id="rounded">
      <rect x="0" y="0" width="850" height="200" rx="6"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="850" height="200" rx="6" fill="#0E1C29"/>

  <g clip-path="url(#rounded)">

    <!-- CRT-развёртка: частые тонкие линии -->
    <g stroke="url(#lineFade)" stroke-width="1">
      <line x1="0" y1="4"   x2="850" y2="4"/>
      <line x1="0" y1="12"  x2="850" y2="12"/>
      <line x1="0" y1="20"  x2="850" y2="20"/>
      <line x1="0" y1="28"  x2="850" y2="28"/>
      <line x1="0" y1="36"  x2="850" y2="36"/>
      <line x1="0" y1="44"  x2="850" y2="44"/>
      <line x1="0" y1="52"  x2="850" y2="52"/>
      <line x1="0" y1="60"  x2="850" y2="60"/>
      <line x1="0" y1="68"  x2="850" y2="68"/>
      <line x1="0" y1="76"  x2="850" y2="76"/>
      <line x1="0" y1="84"  x2="850" y2="84"/>
      <line x1="0" y1="92"  x2="850" y2="92"/>
      <line x1="0" y1="100" x2="850" y2="100"/>
      <line x1="0" y1="108" x2="850" y2="108"/>
      <line x1="0" y1="116" x2="850" y2="116"/>
      <line x1="0" y1="124" x2="850" y2="124"/>
      <line x1="0" y1="132" x2="850" y2="132"/>
      <line x1="0" y1="140" x2="850" y2="140"/>
      <line x1="0" y1="148" x2="850" y2="148"/>
      <line x1="0" y1="156" x2="850" y2="156"/>
      <line x1="0" y1="164" x2="850" y2="164"/>
      <line x1="0" y1="172" x2="850" y2="172"/>
      <line x1="0" y1="180" x2="850" y2="180"/>
      <line x1="0" y1="188" x2="850" y2="188"/>
      <line x1="0" y1="196" x2="850" y2="196"/>
    </g>

  </g>

  <!-- Name -->
  <text
    x="35"
    y="105"
    font-family="Arial Black, Arial, sans-serif"
    font-size="56"
    font-weight="900"
    fill="#ff4500"
    letter-spacing="2"
  >Edward Numbless</text>

  <!-- Profession -->
  <text
    x="38"
    y="150"
    font-family="Arial, Helvetica, sans-serif"
    font-size="24"
    font-weight="bold"
    fill="#c9d1d9"
    letter-spacing="2"
  >SOFTWARE DEVELOPER</text>

</svg>
