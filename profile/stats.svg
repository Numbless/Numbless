<svg
  width="467"
  height="220"
  viewBox="0 0 467 220"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="titleId descId"
>
  <title id="titleId">Numbless — GitHub Statistics, Rank: C</title>
  <desc id="descId">Total Stars Earned: 0, Total Commits (last year): 3, Total PRs: 0, Total Issues: 0, Contributed to (last year): 0</desc>

  <style>
    .header   { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8B1A1A; }
    .stat     { font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #000000; }
    .rank-text{ font: 800 24px 'Segoe UI', Ubuntu, Sans-Serif; fill: #7B2FBE; }
    .bold     { font-weight: 700 }
    .icon     { fill: #000000; }

    .rank-circle-rim { stroke: #7B2FBE; fill: none; stroke-width: 6; opacity: 0.2; }
    .rank-circle     { stroke: #7B2FBE; fill: none; stroke-width: 6;
                       stroke-linecap: round; opacity: 0.9;
                       stroke-dasharray: 251.32;
                       stroke-dashoffset: 170;
                       transform: rotate(-90deg);
                       transform-origin: -10px 8px; }

    .lang-title { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #000000; }
    .lang-name  { font: 600 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #000000; }
    .lang-pct   { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #000000; }
  </style>

  <!-- Фон -->
  <rect x="0.5" y="0.5" rx="4.5" width="466" height="99%"
        fill="#ffffff" stroke="#e4e2e2" stroke-opacity="1"/>

  <g transform="translate(25, 35)">
    <text class="header">Numbless — GitHub Statistics</text>
  </g>

  <g transform="translate(0, 55)">
    <!-- Рейтинг-круг (фиолетовый) -->
    <g transform="translate(390.5, 62)">
      <circle class="rank-circle-rim" cx="-10" cy="8" r="40"/>
      <circle class="rank-circle"     cx="-10" cy="8" r="40"/>
      <text class="rank-text" x="-10" y="8" text-anchor="middle"
            dominant-baseline="central">C</text>
    </g>

    <!-- Статистика (чёрный текст, чёрные иконки) -->
    <g transform="translate(25, 0)">
      <g transform="translate(0, 0)">
        <svg class="icon" viewBox="0 0 16 16" width="16" height="16"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg>
        <text class="stat bold" x="25" y="12.5">Total Stars Earned:</text>
        <text class="stat bold" x="224" y="12.5">0</text>
      </g>
      <g transform="translate(0, 25)">
        <svg class="icon" viewBox="0 0 16 16" width="16" height="16"><path d="M1.643 3.143L.427 1.927A.25.25 0 000 2.104V5.75c0 .138.112.25.25.25h3.646a.25.25 0 00.177-.427L2.715 4.215a6.5 6.5 0 11-1.18 4.458.75.75 0 10-1.493.154 8.001 8.001 0 101.6-5.684z"/></svg>
        <text class="stat bold" x="25" y="12.5">Total Commits (last year):</text>
        <text class="stat bold" x="224" y="12.5">3</text>
      </g>
      <g transform="translate(0, 50)">
        <svg class="icon" viewBox="0 0 16 16" width="16" height="16"><path d="M7.177 3.073L9.573.677A.25.25 0 0110 .854v4.792a.25.25 0 01-.427.177L7.177 3.427a.25.25 0 010-.354zM3.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5z"/></svg>
        <text class="stat bold" x="25" y="12.5">Total PRs:</text>
        <text class="stat bold" x="224" y="12.5">0</text>
      </g>
      <g transform="translate(0, 75)">
        <svg class="icon" viewBox="0 0 16 16" width="16" height="16"><path d="M8 1.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM0 8a8 8 0 1116 0A8 8 0 010 8z"/></svg>
        <text class="stat bold" x="25" y="12.5">Total Issues:</text>
        <text class="stat bold" x="224" y="12.5">0</text>
      </g>
      <g transform="translate(0, 100)">
        <svg class="icon" viewBox="0 0 16 16" width="16" height="16"><path d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9z"/></svg>
        <text class="stat bold" x="25" y="12.5">Contributed to (last year):</text>
        <text class="stat bold" x="224" y="12.5">0</text>
      </g>
    </g>

    <!-- Языки -->
    <g transform="translate(25, 135)">
      <text class="lang-title" x="0" y="0">Languages in Projects</text>

      <svg x="0" y="8" width="417" height="8">
        <defs>
          <clipPath id="barClip">
            <rect x="0" y="0" width="417" height="8" rx="3" ry="3"/>
          </clipPath>
        </defs>
        <g clip-path="url(#barClip)">
          <rect x="0"       y="0" width="417" height="8" fill="#eeeeee"/>
          <rect x="0"       y="0" width="229.35" height="8" fill="#f34b7d"/>
          <rect x="229.35"  y="0" width="125.1"  height="8" fill="#555555"/>
          <rect x="354.45"  y="0" width="41.7"   height="8" fill="#427819"/>
          <rect x="396.15"  y="0" width="20.85"  height="8" fill="#e34c26"/>
        </g>
      </svg>

      <g transform="translate(0, 30)">
        <!-- Строка 1 -->
        <circle cx="5" cy="-4" r="4" fill="#f34b7d"/>
        <text class="lang-name" x="15" y="0">C++</text>
        <text class="lang-pct"  x="70" y="0">55%</text>

        <g transform="translate(140, 0)">
          <circle cx="5" cy="-4" r="4" fill="#555555"/>
          <text class="lang-name" x="15" y="0">C</text>
          <text class="lang-pct"  x="70" y="0">30%</text>
        </g>

        <!-- Строка 2 -->
        <g transform="translate(0, 20)">
          <circle cx="5" cy="-4" r="4" fill="#427819"/>
          <text class="lang-name" x="15" y="0">Makefile</text>
          <text class="lang-pct"  x="70" y="0">10%</text>
        </g>

        <g transform="translate(140, 20)">
          <circle cx="5" cy="-4" r="4" fill="#e34c26"/>
          <text class="lang-name" x="15" y="0">HTML</text>
          <text class="lang-pct"  x="70" y="0">5%</text>
        </g>
      </g>
    </g>
  </g>
</svg>
